name: Windows build and host tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Build CLI and VSIX and run host tests
        shell: pwsh
        run: ./scripts/ci/build-windows.ps1
      - name: Report failed build stage
        if: ${{ failure() }}
        shell: pwsh
        run: |
          $reportPath = 'artifacts/ci-host/host-job.json'
          if (Test-Path -LiteralPath $reportPath) {
            $report = Get-Content -LiteralPath $reportPath -Raw | ConvertFrom-Json
            $message = "Stage $($report.stage): $($report.error)"
            if ($report.stage -eq 'host-tests') {
              $testLog = 'artifacts/ci-host/host-tests.log'
              if (Test-Path -LiteralPath $testLog) {
                $detail = Get-Content -LiteralPath $testLog -Tail 100 |
                  Select-String -Pattern '(^e: |Exception|Could not |Caused by:| FAILED|failed|timed out)' |
                  Select-Object -Last 12 -ExpandProperty Line
                if ($detail) { $message += "`n" + ($detail -join "`n") }
              }
            }
            $testClasses = 'HarmonyOSRecoveryJournalTest', 'ProcessHdcCommandRunnerTest', 'HdcDiagnosticLogConfigTest'
            foreach ($testClass in $testClasses) {
              $file = Get-ChildItem -Path 'artifacts/ci-host/junit' -Filter "TEST-*.$testClass.xml" -ErrorAction SilentlyContinue
              if ($file) {
                [xml]$junit = Get-Content -LiteralPath $file.FullName -Raw
                $failure = $junit.SelectSingleNode('//failure')
                if ($failure) { $message += "`n${testClass}: " + $failure.GetAttribute('message') }
              }
            }
            $escaped = $message.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error::$escaped"
          }
      - name: Upload build evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-build
          path: artifacts/ci-host/
