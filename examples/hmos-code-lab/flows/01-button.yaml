# 状态：2026-11-03 API 26 平板实测，Toast 可见性断言失败。界面语言须为简体中文。
# 手动进入 Button 详情，保持预览中的“按钮示例”可见，operation 使用默认 Click。
# 来源：7aa95cac4eca15e39fc6638cdf1de7db6fb70ad6，componentlibrary 的
# buttonview/component/ButtonBuilder.ets、buttonview/entity/ButtonAttributeMapping.ets
# 及 resources/zh_CN/element/string.json（button_text、btn_click）。
# 点击反馈为 2 秒 Toast；本次未读到“按钮被点击”，保留断言用于后续时序排查。
appId: com.huawei.hmos.sample
name: hmos-code-lab-foreground-button
---
- assertVisible: '^按钮示例$'
- tapOn:
    text: '^按钮示例$'
    retryTapIfNoChange: false
- assertVisible: '^按钮被点击$'
- takeScreenshot: hmos-code-lab-button
