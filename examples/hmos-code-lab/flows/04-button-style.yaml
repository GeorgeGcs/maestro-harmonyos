# Button 详情页的可重复交互。开始和结束时按钮类型均为 Emphasized。
# 官方源码：ButtonAttributeMapping.ets 的 styleMapData；界面语言为简体中文。
appId: com.huawei.hmos.sample
name: hmos-code-lab-button-style
---
- assertVisible: '^按钮示例$'
- assertVisible: '^Emphasized$'
- tapOn:
    text: '^Emphasized$'
    retryTapIfNoChange: false
- assertVisible: '^Textual$'
- tapOn:
    text: '^Textual$'
    retryTapIfNoChange: false
- assertVisible: '^Textual$'
- assertNotVisible: '^Emphasized$'
- takeScreenshot: hmos-code-lab-button-textual
- tapOn:
    text: '^Textual$'
    retryTapIfNoChange: false
- assertVisible: '^Emphasized$'
- tapOn:
    text: '^Emphasized$'
    retryTapIfNoChange: false
- assertVisible: '^Emphasized$'
- assertNotVisible: '^Textual$'
