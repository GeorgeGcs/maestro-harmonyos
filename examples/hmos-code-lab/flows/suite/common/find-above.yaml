appId: com.huawei.hmos.sample
---
- assertVisible:
    text: '^组件$'
    selected: true
- scrollUntilVisible:
    element:
      text: ${TARGET}
      above:
        text: '^组件$'
        selected: true
    direction: UP
    timeout: 180000
    speed: 40
    visibilityPercentage: 100
    centerElement: true
# UP centering only enforces the upper margin in this Maestro version.
# Also enforce the lower margin before tapping above the floating tab bar.
- scrollUntilVisible:
    element:
      text: ${TARGET}
      above:
        text: '^组件$'
        selected: true
    direction: DOWN
    timeout: 180000
    speed: 40
    visibilityPercentage: 100
    centerElement: true
- assertVisible:
    text: ${TARGET}
    above:
      text: '^组件$'
      selected: true
