appId: com.huawei.hmos.sample
---
- runFlow:
    file: find-below.yaml
    env:
      TARGET: '^警告弹窗$'
- tapOn:
    text: '^警告弹窗$'
    above:
      text: '^组件$'
      selected: true
    retryTapIfNoChange: false
- runFlow: ../../03-alert-dialog.yaml
- back
- assertVisible:
    text: '^组件$'
    selected: true
- runFlow:
    file: find-above.yaml
    env:
      TARGET: '^单行文本输入$'
