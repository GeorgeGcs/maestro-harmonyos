# 状态：2026-11-03 在 API 26 平板上单次通过，详见 flows/README.md。界面语言须为简体中文。
# 手动进入 TextInput 详情，使用默认 Normal 输入类型，并清空预览输入框。
# 来源：7aa95cac4eca15e39fc6638cdf1de7db6fb70ad6，componentlibrary 的
# textinput/component/TextInputBuilder.ets 及 resources/zh_CN/element/string.json
# （text_placeholder）。本次已验证占位文本、焦点、输入和清空；其他设备仍需核对。
# 完成后清空本流程写入的 12 个字符，保留应用前台及软键盘。
appId: com.huawei.hmos.sample
name: hmos-code-lab-foreground-input
---
- assertVisible: '^请输入文字$'
- tapOn:
    text: '^请输入文字$'
    retryTapIfNoChange: false
- assertVisible:
    text: '^请输入文字$'
    focused: true
- inputText: maestro-hmos
- assertVisible:
    text: '^maestro-hmos$'
    focused: true
- takeScreenshot: hmos-code-lab-input
- eraseText: 12
- assertVisible:
    text: '^请输入文字$'
    focused: true
