appId: com.huawei.hmos.sample
name: hmos-code-lab-foreground-input
---
- assertVisible: '^请输入文字$'
- tapOn:
    text: '^请输入文字$'
    retryTapIfNoChange: false
- assertVisible:
    text: '^请输入文字$'
    focused: true
- inputText: maestro-hmos
- assertVisible:
    text: '^maestro-hmos$'
    focused: true
- takeScreenshot: hmos-code-lab-input
- eraseText: 12
- assertVisible:
    text: '^请输入文字$'
    focused: true
